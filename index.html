<style>
:root{--bg:#ede8dc;--card:#fff;--black:#111;--accent:#f0b429;--accentD:#c8920a;
--muted:#8a8070;--border:#ddd7c8;--green:#22c55e;--orange:#f97316;--red:#ef4444;
--wa:#25D366;--purple:#7060f0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--black);font-family:'DM Sans',system-ui,sans-serif;
min-height:100vh;font-size:14px;padding-bottom:env(safe-area-inset-bottom);}
.hd{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;line-height:1.1;}

/* HEADER */
header{background:var(--black);height:52px;display:flex;align-items:center;
justify-content:space-between;padding:0 14px;gap:8px;border-bottom:3px solid var(--accent);
position:sticky;top:0;z-index:100;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:800;color:#fff;
letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
.logo span{color:var(--accent);}
.hsub{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;
letter-spacing:.16em;text-transform:uppercase;color:var(--accent);flex:1;text-align:center;}
.hbtns{display:flex;gap:5px;flex-shrink:0;}
.hb{background:none;border:1px solid #333;border-radius:5px;padding:4px 9px;cursor:pointer;
font-family:'Barlow Condensed',sans-serif;font-size:.6rem;font-weight:700;color:#777;
letter-spacing:.08em;text-transform:uppercase;}
.hb:active{background:#222;}

/* PAGE */
.page{padding:13px;max-width:640px;margin:0 auto;}
.spacer{height:84px;}

/* MODE SELECT */
.msel{padding:22px;max-width:400px;margin:0 auto;padding-top:32px;}
.mtitle{text-align:center;margin-bottom:26px;}
.mtitle h1{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;
color:var(--accentD);letter-spacing:.06em;text-transform:uppercase;}
.mtitle p{font-size:13px;color:var(--muted);margin-top:5px;}
.mbtn{display:block;width:100%;border:none;border-radius:14px;padding:19px 17px;
cursor:pointer;text-align:left;margin-bottom:11px;transition:transform .12s;}
.mbtn:active{transform:scale(.98);}
.mbtn-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.mbtn-ico{font-size:25px;}
.mbtn-lock{font-family:'Barlow Condensed',sans-serif;font-size:.58rem;font-weight:700;
letter-spacing:.1em;text-transform:uppercase;border-radius:5px;padding:3px 8px;}
.mbtn h2{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;font-weight:800;
letter-spacing:.05em;text-transform:uppercase;}
.mbtn p{font-size:12.5px;margin-top:5px;line-height:1.45;}
.mb-local{background:var(--black);}
.mb-local h2{color:var(--accent);} .mb-local p{color:#888;}
.mb-local .mbtn-lock{background:rgba(255,255,255,.1);color:#999;}
.mb-compras{background:var(--accent);}
.mb-compras h2{color:var(--black);} .mb-compras p{color:#7a5600;}
.mb-compras .mbtn-lock{background:rgba(0,0,0,.15);color:#7a5600;}
.mb-analisis{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.07);}
.mb-analisis h2{color:var(--black);} .mb-analisis p{color:var(--muted);}
.mb-analisis .mbtn-lock{background:var(--bg);color:var(--muted);}

/* CARDS */
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);
padding:14px;margin-bottom:12px;}
.ctitle{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;
letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;
display:flex;align-items:center;gap:7px;}
.ctitle::before{content:'';width:5px;height:5px;background:var(--accent);border-radius:50%;flex-shrink:0;}

/* PILLS */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px;}
.pill{padding:5px 11px;border-radius:6px;cursor:pointer;border:1.5px solid var(--border);
background:transparent;font-family:'Barlow Condensed',sans-serif;font-size:.66rem;
font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--black);}

/* STOCK ITEM */
.item{background:#fff;border:1.5px solid var(--border);border-radius:10px;
padding:11px 12px;margin-bottom:7px;}
.item.st-out{border-color:var(--red);} .item.st-low{border-color:var(--orange);}
.item.st-ok{opacity:.62;}
.iname{font-weight:700;font-size:13.5px;margin-bottom:8px;}
.sbtns{display:flex;gap:5px;}
.sb{flex:1;padding:8px 3px;border-radius:7px;cursor:pointer;border:1.5px solid var(--border);
background:transparent;color:#bbb;font-size:11.5px;font-weight:700;font-family:'DM Sans',sans-serif;}
.sb.on-out{border-color:var(--red);background:rgba(239,68,68,.1);color:var(--red);}
.sb.on-low{border-color:var(--orange);background:rgba(249,115,22,.1);color:var(--orange);}
.sb.on-ok{border-color:var(--green);background:rgba(34,197,94,.1);color:var(--green);}
.inote{background:#f5f0e8;border:1px solid var(--border);border-radius:6px;padding:6px 9px;
font-size:11.5px;color:#555;width:100%;outline:none;font-family:'DM Sans',sans-serif;margin-top:8px;}
.inote:focus{border-color:var(--accent);}

/* COMPRAS ITEM */
.crow{display:flex;align-items:flex-start;gap:9px;}
.cinfo{flex:1;min-width:0;}
.ctag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;}
.cnote{font-size:11.5px;color:var(--muted);}
.cprice{font-size:10.5px;color:var(--muted);margin-top:4px;}
.cprice b{color:var(--accentD);}
.qwrap{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.qb{width:27px;height:27px;border-radius:6px;border:1px solid var(--border);background:var(--bg);
cursor:pointer;font-size:15px;font-weight:700;color:var(--muted);display:flex;
align-items:center;justify-content:center;}
.qi{width:42px;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;
padding:5px 0;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;
text-align:center;color:var(--muted);outline:none;}
.qi.has{background:#fffbeb;border-color:var(--accent);color:var(--accentD);}
.qu{font-size:10.5px;color:var(--muted);min-width:22px;}

/* BANNERS */
.banner{border-radius:10px;padding:10px 13px;margin-bottom:11px;display:flex;
align-items:center;gap:9px;}
.banner-ico{font-size:20px;flex-shrink:0;}
.banner h3{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:700;
letter-spacing:.08em;text-transform:uppercase;}
.banner p{font-size:11px;color:var(--muted);margin-top:2px;}
.b-warn{background:#fff8f0;border:1.5px solid var(--orange);}
.b-ok{background:#f0fff4;border:1.5px solid var(--green);}
.b-neutral{background:#f8f8f8;border:1px solid var(--border);}
.b-info{background:rgba(240,180,41,.09);border:1px dashed var(--accent);}
.b-info p{color:var(--accentD);font-size:11.5px;line-height:1.5;margin:0;}

/* TOTAL BAR */
.totbar{background:var(--black);border-radius:10px;padding:11px 14px;margin-bottom:11px;
display:flex;align-items:center;justify-content:space-between;}
.totbar .lbl{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;font-weight:700;
letter-spacing:.14em;text-transform:uppercase;color:#666;}
.totbar .sub{font-size:10px;color:#555;margin-top:2px;}
.totbar .val{font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:800;color:var(--accent);}

/* BUTTONS */
.btn{border:none;border-radius:9px;padding:13px;width:100%;cursor:pointer;
font-family:'Barlow Condensed',sans-serif;font-size:.92rem;font-weight:800;
letter-spacing:.09em;text-transform:uppercase;display:block;text-align:center;text-decoration:none;}
.btn:active{opacity:.85;}
.btn-black{background:var(--black);color:var(--accent);}
.btn-accent{background:var(--accent);color:var(--black);}
.btn-wa{background:var(--wa);color:#fff;}
.btn-dark{background:var(--black);color:#fff;}
.btn-ghost{background:none;border:1.5px solid var(--border);color:var(--muted);font-size:.75rem;}
.btn-off{background:var(--border);color:var(--muted);}
.btn-sm{padding:9px;font-size:.75rem;}

/* STICKY FOOTER */
.sticky{position:fixed;bottom:0;left:0;right:0;background:var(--bg);
padding:10px 13px calc(15px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:80;}
.sticky-inner{max-width:640px;margin:0 auto;}

/* PIN */
.pinwrap{padding:22px;max-width:340px;margin:0 auto;padding-top:48px;text-align:center;}
.pin-ico{font-size:42px;margin-bottom:13px;}
.pinwrap h2{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:800;
color:var(--accentD);letter-spacing:.09em;text-transform:uppercase;}
.pinwrap p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.55;}
.pinput{background:#fff;border:2px solid var(--border);border-radius:10px;padding:14px 12px;
font-size:26px;width:100%;text-align:center;outline:none;font-family:'Barlow Condensed',sans-serif;
letter-spacing:8px;color:var(--black);margin-top:20px;}
.pinput.err{border-color:var(--red);animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);
position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:90;}
.tab{flex:1;padding:11px 4px;background:none;border:none;cursor:pointer;
border-bottom:2px solid transparent;font-family:'Barlow Condensed',sans-serif;
font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.tab.on{color:var(--black);border-bottom-color:var(--accent);}

/* TABLE */
table{width:100%;border-collapse:collapse;}
th{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;font-weight:700;
letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:5px 4px;
border-bottom:1.5px solid var(--border);text-align:left;}
td{padding:6px 4px;border-bottom:1px solid var(--bg);font-size:11.5px;}
tr:last-child td{border-bottom:none;}
.tname{font-weight:600;max-width:140px;line-height:1.25;}
.tnum{text-align:right;color:var(--muted);}
.tunit{text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:800;
font-size:.9rem;color:var(--accentD);}
.packi{width:56px;background:var(--bg);border:1px solid var(--border);border-radius:5px;
padding:4px 3px;font-size:11px;text-align:center;outline:none;font-family:'DM Sans',sans-serif;}

/* MSG BOX */
.msgbox{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:14px;
font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;min-height:170px;
font-family:'DM Sans',sans-serif;-webkit-user-select:text;user-select:text;}
.pastebox{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:12px;
font-size:12px;width:100%;min-height:120px;outline:none;font-family:'DM Sans',sans-serif;resize:vertical;}
.pastebox:focus{border-color:var(--accent);}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;
align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
.modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:620px;
max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom);}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.drag{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 11px;
border-bottom:1px solid var(--border);flex-shrink:0;}
.mhd h2{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;
letter-spacing:.05em;text-transform:uppercase;}
.mclose{background:var(--bg);border:none;width:28px;height:28px;border-radius:7px;
cursor:pointer;color:var(--muted);font-size:15px;}
.mbody{overflow-y:auto;flex:1;padding:15px 18px;-webkit-overflow-scrolling:touch;}

/* FORM */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg.full{grid-column:1/-1;}
.flbl{font-family:'Barlow Condensed',sans-serif;font-size:.6rem;font-weight:700;
letter-spacing:.11em;text-transform:uppercase;color:var(--muted);}
.finp{background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;
font-size:12.5px;width:100%;outline:none;font-family:'DM Sans',sans-serif;}
.finp:focus{border-color:var(--accent);}

/* KIT */
.kitrow{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11.5px;
color:var(--muted);border-top:1px solid var(--bg);}
.kitrow:first-of-type{border-top:none;}
.kq{font-weight:700;color:var(--black);min-width:22px;}
.kn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kbrow{display:flex;gap:5px;margin-bottom:5px;align-items:center;}
.ksel{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:5px;
padding:6px 8px;font-size:11.5px;outline:none;font-family:'DM Sans',sans-serif;}
.kqi{width:48px;background:var(--bg);border:1px solid var(--border);border-radius:5px;
padding:6px 4px;font-size:11.5px;text-align:center;outline:none;font-family:'DM Sans',sans-serif;}
.kdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 5px;}
.dashbtn{width:100%;background:none;border:1.5px dashed var(--border);border-radius:7px;
padding:8px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:.68rem;
font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;}

/* UPLOAD */
.upz{border:2px dashed var(--border);border-radius:10px;padding:30px 18px;text-align:center;
cursor:pointer;background:var(--bg);display:block;}
.upz .ico{font-size:34px;margin-bottom:9px;}
.upz h3{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:800;
letter-spacing:.05em;text-transform:uppercase;}
.upz p{font-size:11.5px;color:var(--muted);margin-top:5px;}
.spin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--accent);
border-radius:50%;margin:0 auto 13px;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* EMPTY */
.empty{text-align:center;padding:28px 14px;color:var(--muted);font-size:12.5px;line-height:1.6;}
.empty .ico{font-size:40px;margin-bottom:11px;}

/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
background:var(--black);color:var(--accent);border:1.5px solid var(--accent);border-radius:8px;
padding:9px 18px;z-index:9999;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;
font-weight:700;letter-spacing:.09em;text-transform:uppercase;transition:transform .28s;white-space:nowrap;}
#toast.on{transform:translateX(-50%) translateY(0);}

@media(max-width:560px){.fgrid{grid-template-columns:1fr}.fg.full{grid-column:1}}
</style>
</head>

function lg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function cloudCfg(){return lg(LS.cloud,null);}

/* JSONBin sync — optional */
async function cloudPut(data){
  var c=cloudCfg(); if(!c||!c.bin||!c.key) return false;
  try{
    var r=await fetch("https://api.jsonbin.io/v3/b/"+c.bin,{
      method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":c.key},
      body:JSON.stringify(data)});
    return r.ok;
  }catch(e){return false;}
}
async function cloudGet(){
  var c=cloudCfg(); if(!c||!c.bin||!c.key) return null;
  try{
    var r=await fetch("https://api.jsonbin.io/v3/b/"+c.bin+"/latest",{
      headers:{"X-Master-Key":c.key}});
    if(!r.ok) return null;
    var j=await r.json();
    return j.record||null;
  }catch(e){return null;}
}

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},2400);}
function money(v){return v>=100?"$"+Math.round(v).toLocaleString("es-AR")
  :v>=10?"$"+v.toFixed(1).replace(".",","):"$"+v.toFixed(2).replace(".",",");}
function bigMoney(v){return "$"+Math.round(v).toLocaleString("es-AR");}
function parseD(s){var p=(s||"").split("/");return p.length<3?new Date(0):new Date(+p[2],+p[1]-1,+p[0]);}
function dateLabel(s){var p=(s||"").split("/");return p.length<3?s:MONTHS[+p[1]-1]+"-"+p[2].slice(-2);}
function timeAgo(iso){if(!iso)return"";var d=(Date.now()-new Date(iso))/1000;
  if(d<60)return"recién";if(d<3600)return"hace "+Math.floor(d/60)+" min";
  if(d<86400)return"hace "+Math.floor(d/3600)+" h";return"hace "+Math.floor(d/86400)+" d";}
function guessPack(n){var m=(n||"").toUpperCase().match(/X\s?(\d{2,5})/);
  if(m){var v=+m[1];if(v>=10&&v<=5000)return v;}return 1;}
function pinHash(p){var a=5381,b=52711,s="onda-"+p+"-food";
  for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=(a*33)^c;b=(b*31)^c;}
  return (a>>>0).toString(36)+(b>>>0).toString(36);}
function copyTxt(t){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(function(){toast("✓ Copiado");}).catch(fb);
  }else fb();
  function fb(){var ta=document.createElement("textarea");ta.value=t;
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,99999);
    try{document.execCommand("copy");toast("✓ Copiado");}catch(e){toast("⚠ Copiá manual");}
    document.body.removeChild(ta);}
}

function getInvoices(){
  var v=lg(LS.inv,null);
  if(!v||!v.length){ls(LS.inv,SEED);return SEED.slice();}
  return v;
}
function sortedInv(){return getInvoices().slice().sort(function(a,b){return parseD(a.date)-parseD(b.date);});}
function latestPrices(){var m={};sortedInv().forEach(function(f){
  f.items.forEach(function(it){m[it.code]={code:it.code,name:it.name,price:it.price,label:f.label};});});return m;}
function packOf(code){var p=lg(LS.packs,{});var lp=latestPrices()[code];
  return p[code]!==undefined?p[code]:guessPack(lp?lp.name:"");}
function unitCost(code){var lp=latestPrices()[code];return lp?lp.price/(packOf(code)||1):null;}

/* ══════════════════════════════════════════════════════════
   REPORT ENCODING (WhatsApp bridge)
══════════════════════════════════════════════════════════ */
function encodeReport(items){
  var parts=items.filter(function(i){return i.status!=="ok";}).map(function(i){
    return i.id+(i.status==="out"?"o":"l")+(i.note?"~"+i.note.replace(/[|~]/g,""):"");
  });
  return "#OF|"+parts.join("|");
}
function decodeReport(txt){
  var m=(txt||"").match(/#OF\|([^\n]*)/);
  if(!m) return null;
  var items=getCatalog().map(function(c){return{id:c.id,name:c.name,unit:c.unit,code:c.code,status:"ok",note:""};});
  m[1].split("|").filter(Boolean).forEach(function(tok){
    var mm=tok.match(/^(\d+)([ol])(?:~(.*))?$/);
    if(!mm) return;
    var it=items.find(function(x){return x.id===+mm[1];});
    if(it){it.status=mm[2]==="o"?"out":"low";it.note=mm[3]||"";}
  });
  return {submittedAt:new Date().toISOString(),reportStatus:"pending",items:items};
}

var state={mode:null,pending:null};

function boot(){

function go(m){
  if(m==="compras"||m==="analisis"){
    var stored=lg(LS.pin,null), unlocked=lg(LS.unlock,null);
    if(stored&&unlocked===stored){state.mode=m;ls(LS.mode,m);render();return;}
    state.pending=m;render();return;
  }
  state.mode=m;
  if(m)ls(LS.mode,m); else localStorage.removeItem(LS.mode);
  render();
}
function lockAll(){
  localStorage.removeItem(LS.unlock);localStorage.removeItem(LS.mode);
  state.mode=null;state.pending=null;render();toast("🔒 Bloqueado");
}
function render(){
  if(state.pending){renderPin();return;}
  if(state.mode==="local"){renderLocal();return;}
  if(state.mode==="compras"){renderCompras();return;}
  if(state.mode==="analisis"){renderAnalisis();return;}
  renderSelect();
}

  '<input class="pinput" id="pin1" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autofocus>'+
  (setup?'<input class="pinput" id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="repetir" style="margin-top:10px">':'')+
  '<button class="btn btn-black" style="margin-top:16px" onclick="submitPin()">'+(setup?"✓ Crear PIN y entrar":"→ Entrar")+'</button>'+
  '<button class="btn btn-ghost" style="margin-top:9px" onclick="state.pending=null;render()">← Volver</button>'+
  (setup?'<p style="font-size:10.5px;margin-top:16px">Anotá el PIN en un lugar seguro.</p>':'')+
  '</div>';
  var i1=$("pin1");
  i1.addEventListener("keydown",function(e){if(e.key==="Enter")submitPin();});
  if($("pin2"))$("pin2").addEventListener("keydown",function(e){if(e.key==="Enter")submitPin();});
  setTimeout(function(){i1.focus();},100);
}
function submitPin(){
  var stored=lg(LS.pin,null), p1=$("pin1").value;
  if(!stored){
    var p2=$("pin2").value;
    if(p1.length<4){toast("⚠ Mínimo 4 dígitos");return;}
    if(p1!==p2){toast("⚠ No coinciden");return;}
    var hp=pinHash(p1);ls(LS.pin,hp);ls(LS.unlock,hp);
    state.mode=state.pending;state.pending=null;ls(LS.mode,state.mode);
    toast("✓ PIN creado");render();
  }else{
    if(pinHash(p1)===stored){
      ls(LS.unlock,stored);state.mode=state.pending;state.pending=null;
      ls(LS.mode,state.mode);render();
    }else{
      $("pin1").classList.add("err");$("pin1").value="";
      setTimeout(function(){$("pin1").classList.remove("err");},450);
      toast("⚠ PIN incorrecto");
    }
  }
}

async function sendReport(){
  var alerts=L.items.filter(function(i){return i.status!=="ok";});
  if(!alerts.length){toast("⚠ No marcaste nada");return;}
  var today=new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});

  m+="\n"+encodeReport(L.items);

  var payload={submittedAt:new Date().toISOString(),reportStatus:"pending",items:L.items};
  ls(LS.report,payload);
  await cloudPut(payload);

  L.sent=true;renderLocal();
}

  if(!shown.length)html+='<div class="empty">No hay alertas. Todo en stock.</div>';

  var sIco={out:"❌",low:"⚠️",ok:"✅"},sCol={out:"var(--red)",low:"var(--orange)",ok:"var(--green)"},

function initQtys(){
  C.qtys={};
  (C.report.items||[]).forEach(function(it){
    var c=getCatalog().find(function(x){return x.id===it.id;});
    C.qtys[it.id]=it.status!=="ok"?(c?c.qty:1):0;
  });
}
function chQty(id,d){C.qtys[id]=Math.max(0,(C.qtys[id]||0)+d);renderCompras();}
function setQty(id,v){C.qtys[id]=Math.max(0,parseInt(v)||0);renderCompras();}

function renderComprasPaste(){

function genPedido(){
  var lp=latestPrices();
  var toOrder=(C.report.items||[]).filter(function(i){return (C.qtys[i.id]||0)>0;});

  toOrder.forEach(function(i){m+="▪️ *"+i.name+":* "+C.qtys[i.id]+" "+i.unit+"\n";});
  m+="\n_Por favor confirmar disponibilidad y precio. Muchas gracias!_ 🙏";
  C.msg=m;C.screen="message";renderCompras();
}

function tabResumen(){
  var inv=sortedInv(),lp=latestPrices();

    var a=inv[0],b=inv[inv.length-1];
    var common=a.items.filter(function(x){return b.items.some(function(y){return y.code===x.code;});});
    if(common.length){
      var ch=common.map(function(x){var bp=b.items.find(function(y){return y.code===x.code;}).price;

  '<div class="hd" style="font-size:1.5rem;font-weight:800;color:var(--accent);margin-top:5px">'+bigMoney(totalSpend)+'</div>'+
  '<div style="font-size:10.5px;color:#555;margin-top:3px">sin IVA</div></div>'+
  '<div class="card" style="margin:0;border-top:3px solid var(--red)">'+
  '<div class="hd" style="font-size:.6rem;color:var(--muted);letter-spacing:.14em">Variación promedio</div>'+
  '<div class="hd" style="font-size:1.5rem;font-weight:800;color:var(--red);margin-top:5px">'+
  (avg!==null?(avg>=0?"+":"")+(avg*100).toFixed(1)+"%":"—")+'</div>'+
  '<div style="font-size:10.5px;color:var(--muted);margin-top:3px">'+
  (inv.length>=2?inv[0].label+" → "+inv[inv.length-1].label:"—")+'</div></div></div>'+

  '<div style="height:200px"><canvas id="ch1"></canvas></div></div>'+

  '<div style="height:160px"><canvas id="ch2"></canvas></div></div>'+
  '<div class="card"><div class="ctitle">Facturas cargadas</div>';

    '<div><div class="hd" style="font-size:.72rem;color:var(--muted)">'+esc(f.date)+'</div>'+
    '<div style="font-size:10px;color:var(--muted);opacity:.7;margin-top:1px">'+esc(f.id)+' · '+f.items.length+' prod.</div></div>'+
    '<div class="hd" style="font-size:1rem;font-weight:800;color:var(--accentD)">'+bigMoney(f.total)+'</div></div>';
  });

}

function editProd(id,field,val){
  var cat=getCatalog();
  var p=cat.find(function(x){return x.id===id;});
  if(!p)return;
  if(field==="qty")p.qty=Math.max(1,parseInt(val)||1);
  else if(field==="code")p.code=val||null;
  else if(field==="name"){var v=(val||"").trim();if(!v){toast("⚠ Nombre vacío");renderAnalisis();return;}p.name=v;}
  else if(field==="unit")p.unit=(val||"").trim()||"unid";
  saveCatalog(cat);
  if(field==="name"||field==="code")renderAnalisis();
  else toast("✓ Guardado");
}
function addProd(){
  var cat=getCatalog();
  var maxId=cat.reduce(function(m,p){return Math.max(m,p.id);},0);
  cat.push({id:maxId+1,name:"Producto nuevo",unit:"caja",qty:1,code:null});
  saveCatalog(cat);toast("✓ Agregado — editá el nombre");renderAnalisis();
}
function delProd(id){
  var cat=getCatalog();
  var p=cat.find(function(x){return x.id===id;});
  if(!p)return;
  if(!confirm("¿Eliminar \"" + p.name + "\" de la lista?"))return;
  saveCatalog(cat.filter(function(x){return x.id!==id;}));
  toast("Eliminado");renderAnalisis();
}
function exportCat(){
  copyTxt("#CAT|"+JSON.stringify(getCatalog()));
}
function importCat(){
  var t=prompt("Pegá el código del catálogo (empieza con #CAT|):");
  if(!t)return;
  var m=t.match(/#CAT\|([\s\S]*)/);
  if(!m){toast("⚠ Código inválido");return;}
  try{
    var c=JSON.parse(m[1].trim());
    if(!Array.isArray(c)||!c.length)throw 0;
    saveCatalog(c);toast("✓ Catálogo importado");renderAnalisis();
  }catch(e){toast("⚠ No se pudo leer el código");}
}
function doResetCat(){
  if(!confirm("¿Volver a la lista original? Se pierden tus ediciones."))return;
  resetCatalog();toast("✓ Restaurado");renderAnalisis();
}

    body='<label class="upz" for="invf"><div class="ico">📸</div>'+
    '<h3>Subí la foto de la factura</h3><p>JPG, PNG · máx 15 MB</p></label>'+
    '<input id="invf" type="file" accept="image/*" style="display:none" onchange="pickInv(this.files[0])">'+
    '<p style="text-align:center;margin-top:13px;font-size:11.5px;color:var(--muted)">La IA lee productos y precios automáticamente.</p>'+
    '<button class="btn btn-ghost btn-sm" style="margin-top:13px" onclick="manualInv()">✎ O cargarla manualmente</button>';
  }
  if(A.inv==="preview"){
    body='<div style="display:flex;gap:13px;flex-wrap:wrap">'+
    '<img src="'+A.prev+'" style="width:110px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">'+
    '<div style="flex:1;min-width:180px">'+
    '<button class="btn btn-accent" onclick="analyzeInv()">🔍 Analizar con IA</button>'+
    '<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="A.inv=\'upload\';renderAnalisis()">← Cambiar imagen</button>'+
    '</div></div>';
  }
  if(A.inv==="loading"){
    body='<div style="text-align:center;padding:40px 18px"><div class="spin"></div>'+
    '<h3 class="hd" style="font-size:.95rem;font-weight:800">Analizando factura…</h3>'+
    '<p style="font-size:11.5px;color:var(--muted);margin-top:5px">Leyendo productos y precios</p></div>';
  }
  if(A.inv==="review"){
    body='<div class="fgrid">'+
    '<div class="fg"><label class="flbl">Fecha</label><input class="finp" id="rvDate" value="'+esc(A.rvDate)+'" placeholder="DD/MM/YYYY"></div>'+
    '<div class="fg"><label class="flbl">N° factura</label><input class="finp" id="rvId" value="'+esc(A.rvId)+'" placeholder="FAC A0002-…"></div>'+
    '</div><div class="flbl" style="margin-bottom:7px">Productos — revisá y corregí</div>'+
    '<div style="max-height:270px;overflow-y:auto;margin-bottom:10px" id="rvBody">';
    A.rvRows.forEach(function(r,i){
      body+='<div class="kbrow" data-i="'+i+'">'+
      '<input class="ksel" placeholder="Producto" value="'+esc(r.name)+'" oninput="A.rvRows['+i+'].name=this.value">'+
      '<input class="kqi" style="width:44px" placeholder="cód" value="'+esc(r.code)+'" oninput="A.rvRows['+i+'].code=this.value">'+
      '<input class="kqi" type="number" step="0.5" value="'+r.qty+'" oninput="A.rvRows['+i+'].qty=this.value">'+
      '<input class="kqi" style="width:64px;text-align:right" type="number" value="'+r.price+'" oninput="A.rvRows['+i+'].price=this.value">'+
      '<button class="kdel" onclick="A.rvRows.splice('+i+',1);renderAnalisis()">✕</button></div>';
    });
    body+='</div><button class="dashbtn" onclick="A.rvRows.push({name:\'\',code:\'\',qty:1,price:0});renderAnalisis()">＋ Agregar fila</button>'+
    '<button class="btn btn-black" onclick="saveInv()">✓ Agregar al dashboard</button>';
  }
  return '<div class="ov on" onclick="if(event.target===this)closeInv()"><div class="modal">'+
  '<div class="drag"></div><div class="mhd"><h2>📄 Nueva factura</h2>'+
  '<button class="mclose" onclick="closeInv()">✕</button></div>'+
  '<div class="mbody">'+body+'</div></div></div>';
}
function pickInv(f){
  if(!f||!f.type.indexOf("image")!==0&&!f.type.startsWith("image/")){toast("⚠ Solo imágenes");return;}
  if(f.size>15*1024*1024){toast("⚠ Máx 15 MB");return;}
  var r=new FileReader();
  r.onload=function(e){A.b64=e.target.result.split(",")[1];A.mime=f.type;
    A.prev=e.target.result;A.inv="preview";renderAnalisis();};
  r.readAsDataURL(f);
}
function manualInv(){A.rvDate="";A.rvId="";A.rvRows=[{name:"",code:"",qty:1,price:0}];
  A.inv="review";renderAnalisis();}
async function analyzeInv(){
  A.inv="loading";renderAnalisis();
  try{
    var r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:A.mime,data:A.b64}},
          {type:"text",text:'Extraé los datos de esta factura argentina de papelería.\n\nDevolvé SOLO este JSON:\n{"date":"DD/MM/YYYY","invoice_id":"FAC A0002-NNNNN","subtotal":0,"total":0,"items":[{"code":"XXX","name":"NOMBRE","qty":0,"price":0}]}\n\n- price = precio UNITARIO (columna Precio, NO SubTotal)\n- qty = columna Cantidad\n- subtotal = Importe Neto Gravado\n- total = Importe Total'}
        ]}]})});
    var d=await r.json();
    var t=(d.content||[]).filter(function(b){return b.type==="text";})[0];
    var p=JSON.parse((t?t.text:"").replace(/```json|```/g,"").trim());
    A.rvDate=p.date||"";A.rvId=p.invoice_id||"";
    A.rvRows=(p.items||[]).map(function(it){return{name:it.name||"",code:it.code||"",qty:it.qty||1,price:it.price||0};});
    A.inv="review";renderAnalisis();
  }catch(e){
    toast("⚠ No se pudo leer. Cargá manual.");
    A.rvDate="";A.rvId="";A.rvRows=[{name:"",code:"",qty:1,price:0}];
    A.inv="review";renderAnalisis();
  }
}
function saveInv(){
  var date=$("rvDate").value.trim(),id=$("rvId").value.trim();
  if(!date){toast("⚠ Falta la fecha");return;}
  var items=A.rvRows.filter(function(r){return (r.name||"").trim();}).map(function(r){
    return{code:(r.code||"").trim()||("X"+Math.random().toString(36).slice(2,6)),
      name:(r.name||"").trim().toUpperCase(),
      qty:parseFloat(r.qty)||1,price:parseFloat(r.price)||0};});
  if(!items.length){toast("⚠ Agregá productos");return;}
  var sub=items.reduce(function(s,i){return s+i.qty*i.price;},0);
  var inv=getInvoices();
  inv.push({id:id||("MAN-"+Date.now()),date:date,label:dateLabel(date),
    subtotal:Math.round(sub),total:Math.round(sub*1.21),items:items});
  ls(LS.inv,inv);closeInv();toast("✓ Factura agregada");
}

/* ── KIT MODAL ── */
function openKit(id){
  var lp=latestPrices();
  var opts=Object.keys(lp);
  if(id){var k=lg(LS.kits,[]).find(function(x){return x.id===id;});
    A.kb={id:k.id,name:k.name,items:k.items.slice()};}
  else A.kb={name:"",items:opts.length?[{code:opts[0],qty:1}]:[]};
  renderAnalisis();
}
function modalKit(){
  if(!A.kb)return"";
  var lp=latestPrices();
  var opts=Object.keys(lp).map(function(k){return lp[k];})
    .sort(function(a,b){return a.name.localeCompare(b.name);});
  var tot=A.kb.items.reduce(function(s,i){var u=unitCost(i.code);return s+(u?u*i.qty:0);},0);
  var body='<div class="fg" style="margin-bottom:12px"><label class="flbl">Nombre del armado</label>'+
  '<input class="finp" id="kbName" value="'+esc(A.kb.name)+'" placeholder="Ej: Delivery estándar" oninput="A.kb.name=this.value"></div>'+
  '<div class="flbl" style="margin-bottom:6px">Insumos que lleva</div>';
  A.kb.items.forEach(function(it,i){
    var u=unitCost(it.code);
    body+='<div class="kbrow"><select class="ksel" onchange="A.kb.items['+i+'].code=this.value;renderAnalisis()">'+
    opts.map(function(o){return '<option value="'+esc(o.code)+'"'+(o.code===it.code?" selected":"")+'>'+esc(o.name.slice(0,30))+'</option>';}).join("")+
    '</select><input class="kqi" type="number" min="1" value="'+it.qty+'" onchange="A.kb.items['+i+'].qty=Math.max(1,parseInt(this.value)||1);renderAnalisis()">'+
    '<span style="font-size:10.5px;color:var(--muted);min-width:46px;text-align:right">'+(u?money(u*it.qty):"—")+'</span>'+
    '<button class="kdel" onclick="A.kb.items.splice('+i+',1);renderAnalisis()">✕</button></div>';
  });
  body+='<button class="dashbtn" onclick="addKitItem()">＋ Agregar insumo</button>'+
  '<div class="totbar"><span class="lbl">Costo del armado</span><span class="val">'+money(tot)+'</span></div>'+
  '<button class="btn btn-accent" onclick="saveKit()">✓ Guardar armado</button>'+
  '<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="A.kb=null;renderAnalisis()">Cancelar</button>';
  return '<div class="ov on" onclick="if(event.target===this){A.kb=null;renderAnalisis()}"><div class="modal">'+
  '<div class="drag"></div><div class="mhd"><h2>'+(A.kb.id?"✎ Editar armado":"＋ Nuevo armado")+'</h2>'+
  '<button class="mclose" onclick="A.kb=null;renderAnalisis()">✕</button></div>'+
  '<div class="mbody">'+body+'</div></div></div>';
}
function addKitItem(){
  var opts=Object.keys(latestPrices());
  if(!opts.length){toast("⚠ Cargá facturas primero");return;}
  A.kb.items.push({code:opts[0],qty:1});renderAnalisis();
}
function saveKit(){
  if(!A.kb.name.trim()){toast("⚠ Poné un nombre");return;}
  if(!A.kb.items.length){toast("⚠ Agregá insumos");return;}
  var kits=lg(LS.kits,[]);
  if(A.kb.id)kits=kits.map(function(k){return k.id===A.kb.id?{id:A.kb.id,name:A.kb.name,items:A.kb.items}:k;});
  else kits.push({id:Date.now(),name:A.kb.name,items:A.kb.items});
  ls(LS.kits,kits);A.kb=null;toast("✓ Guardado");renderAnalisis();
}

/* GO */
boot();
</script>
